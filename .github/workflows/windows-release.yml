name: Windows release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and detect existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne "v$version") { throw 'The version tag must match package.json.' }
            if (!(Test-Path -LiteralPath "docs/releases/v$version.md")) { throw 'Missing version-specific release notes.' }
            gh release view "$env:REF_NAME" --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) {
              'exists=true' >> $env:GITHUB_OUTPUT
              Write-Output 'This release already exists. Leaving its assets unchanged.'
            } else {
              'exists=false' >> $env:GITHUB_OUTPUT
            }
            $global:LASTEXITCODE = 0
          } else {
            'exists=false' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/setup-node@v7.1.0
        if: steps.release.outputs.exists != 'true'
        with:
          node-version: "22.18.0"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        if: steps.release.outputs.exists != 'true'
        with:
          python-version: "3.12"
      - name: Install build dependencies
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .importer-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.importer-venv/Scripts/python.exe -m pip install -r scripts/importer-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build Windows installer
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:updates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        if: steps.release.outputs.exists != 'true'
        with:
          name: Crate-Digger-Windows-${{ github.ref_name }}
          path: |
            release/Crate-Digger-Setup-*.exe
            release/Crate-Digger-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - name: Create draft release
        if: github.ref_type == 'tag' && steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.mjs
